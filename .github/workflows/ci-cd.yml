name: QuickNotify CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────
  # AUTH SERVICE TESTS
  # ────────────────────────────────────────
  auth-service-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'auth-service/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./auth-service
        run: npm ci
      
      - name: Run tests
        working-directory: ./auth-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: auth_test
          JWT_SECRET: test-secret-key
        run: npm test -- --watchAll=false

  # ────────────────────────────────────────
  # NOTIFICATION SERVICE TESTS
  # ────────────────────────────────────────
  notification-service-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'notification-service/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./notification-service
        run: npm ci
      
      - name: Run tests
        working-directory: ./notification-service
        env:
          MONGODB_URI: mongodb://admin:admin@localhost:27017/notification_test
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672
          JWT_SECRET: test-secret-key
        run: npm test -- --watchAll=false

  # ────────────────────────────────────────
  # GATEWAY INTEGRATION TESTS
  # ────────────────────────────────────────
  gateway-integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install Auth Service
        working-directory: ./auth-service
        run: npm ci
      
      - name: Start Auth Service
        working-directory: ./auth-service
        env:
          PORT: 3001
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: auth_test
          JWT_SECRET: test-secret-key
        run: npm start > /tmp/auth.log 2>&1 &
      
      - name: Install Notification Service
        working-directory: ./notification-service
        run: npm ci
      
      - name: Start Notification Service
        working-directory: ./notification-service
        env:
          PORT: 3002
          MONGODB_URI: mongodb://admin:admin@localhost:27017/notification_test
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672
          JWT_SECRET: test-secret-key
        run: npm start > /tmp/notification.log 2>&1 &
      
      - name: Install Gateway
        working-directory: ./gateway
        run: npm ci
      
      - name: Wait for services
        run: sleep 5
      
      - name: Run integration tests
        working-directory: ./gateway
        env:
          AUTH_SERVICE_URL: http://localhost:3001
          NOTIFICATION_SERVICE_URL: http://localhost:3002
          JWT_SECRET: test-secret-key
        run: npm run test:integration -- --watchAll=false

  # ────────────────────────────────────────
  # DELIVERY SERVICE TESTS
  # ────────────────────────────────────────
  delivery-service-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Maven tests
        working-directory: ./delivery-service
        env:
          SPRING_DATA_MONGODB_URI: mongodb://admin:admin@localhost:27017/delivery_test
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: admin
          SPRING_RABBITMQ_PASSWORD: admin123
        run: mvn clean test

  # ────────────────────────────────────────
  # FINAL STATUS
  # ────────────────────────────────────────
  final-status:
    runs-on: ubuntu-latest
    needs: [auth-service-tests, notification-service-tests, gateway-integration-tests, delivery-service-tests]
    if: always()
    
    steps:
      - name: All tests passed! ✅
        if: ${{ needs.auth-service-tests.result == 'success' && needs.notification-service-tests.result == 'success' && needs.gateway-integration-tests.result == 'success' && needs.delivery-service-tests.result == 'success' }}
        run: echo "✅ All 32 tests passed successfully!"
      
      - name: Some tests failed ❌
        if: ${{ failure() }}
        run: echo "❌ Check logs for details"