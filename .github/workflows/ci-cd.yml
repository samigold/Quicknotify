name: QuickNotify CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ────────────────────────────────────────
  # AUTH SERVICE TESTS
  # ────────────────────────────────────────
  auth-service-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'auth-service/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./auth-service
        run: npm ci
      
      - name: Run tests
        working-directory: ./auth-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test123
          DB_NAME: auth_test
          JWT_SECRET: test-secret-key
        run: npm test -- --coverage --watchAll=false
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./auth-service/coverage/coverage-final.json
          flags: auth-service
          name: auth-service-coverage

  # ────────────────────────────────────────
  # NOTIFICATION SERVICE TESTS
  # ────────────────────────────────────────
  notification-service-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo123
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      rabbitmq:
        image: rabbitmq:3.12-management
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        options: >-
          --health-cmd rabbitmq-diagnostics ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'notification-service/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./notification-service
        run: npm ci
      
      - name: Run tests
        working-directory: ./notification-service
        env:
          MONGODB_URI: mongodb://mongo:mongo123@localhost:27017/notification_test
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672
          JWT_SECRET: test-secret-key
        run: npm test -- --coverage --watchAll=false
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./notification-service/coverage/coverage-final.json
          flags: notification-service
          name: notification-service-coverage

  # ────────────────────────────────────────
  # GATEWAY INTEGRATION TESTS
  # ────────────────────────────────────────
  gateway-integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo123
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      rabbitmq:
        image: rabbitmq:3.12-management
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        options: >-
          --health-cmd rabbitmq-diagnostics ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Auth Service dependencies
        working-directory: ./auth-service
        run: npm ci
      
      - name: Start Auth Service
        working-directory: ./auth-service
        env:
          PORT: 3001
          DB_HOST: localhost
          DB_USER: test
          DB_PASSWORD: test123
          DB_NAME: auth_test
          JWT_SECRET: test-secret-key
        run: npm start &
      
      - name: Install Notification Service dependencies
        working-directory: ./notification-service
        run: npm ci
      
      - name: Start Notification Service
        working-directory: ./notification-service
        env:
          PORT: 3002
          MONGODB_URI: mongodb://mongo:mongo123@localhost:27017/notification_test
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672
          JWT_SECRET: test-secret-key
        run: npm start &
      
      - name: Install Gateway dependencies
        working-directory: ./gateway
        run: npm ci
      
      - name: Wait for services to start
        run: sleep 5
      
      - name: Run integration tests
        working-directory: ./gateway
        env:
          AUTH_SERVICE_URL: http://localhost:3001
          NOTIFICATION_SERVICE_URL: http://localhost:3002
          JWT_SECRET: test-secret-key
        run: npm run test:integration -- --coverage --watchAll=false
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./gateway/coverage/coverage-final.json
          flags: gateway
          name: gateway-coverage

  # ────────────────────────────────────────
  # DELIVERY SERVICE TESTS (JAVA)
  # ────────────────────────────────────────
  delivery-service-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo123
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      rabbitmq:
        image: rabbitmq:3.12-management
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        options: >-
          --health-cmd rabbitmq-diagnostics ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run tests with Maven
        working-directory: ./delivery-service
        env:
          SPRING_DATA_MONGODB_URI: mongodb://mongo:mongo123@localhost:27017/delivery_test
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: admin
          SPRING_RABBITMQ_PASSWORD: admin123
        run: mvn clean test

  # ────────────────────────────────────────
  # BUILD STATUS CHECK
  # ────────────────────────────────────────
  build-status:
    runs-on: ubuntu-latest
    needs: [auth-service-tests, notification-service-tests, gateway-integration-tests, delivery-service-tests]
    
    steps:
      - name: Check build status
        run: echo "✅ All tests passed!"
      
      - name: Create status badge
        run: |
          echo "Build Status: ![Build](https://github.com/${{ github.repository }}/workflows/QuickNotify%20CI%2FCD%20Pipeline/badge.svg)"