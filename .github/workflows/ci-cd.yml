name: QuickNotify CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ────────────────────────────────────────
  # AUTH SERVICE TESTS
  # ────────────────────────────────────────
  auth-service-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: auth-service/package-lock.json

      - name: Install dependencies
        working-directory: ./auth-service
        run: npm ci

      - name: Run tests
        working-directory: ./auth-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DB_NAME: auth_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npx dotenv-cli -e /dev/null -- npm test -- --forceExit || npm test -- --forceExit

  # ────────────────────────────────────────
  # NOTIFICATION SERVICE TESTS
  # ────────────────────────────────────────
  notification-service-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo123
        options: >-
          --health-cmd "mongosh --username mongo --password mongo123 --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 27017:27017

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: notification-service/package-lock.json

      - name: Install dependencies
        working-directory: ./notification-service
        run: npm ci

      - name: Run tests
        working-directory: ./notification-service
        env:
          PORT: 3002
          MONGO_URI: mongodb://mongo:mongo123@localhost:27017/notification_test?authSource=admin
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm test -- --forceExit

  # ────────────────────────────────────────
  # GATEWAY INTEGRATION TESTS
  # ────────────────────────────────────────
  gateway-integration-tests:
    runs-on: ubuntu-latest
    needs: [auth-service-tests, notification-service-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongodb:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo123
        options: >-
          --health-cmd "mongosh --username mongo --password mongo123 --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 27017:27017

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all Node dependencies
        run: |
          cd auth-service && npm ci
          cd ../notification-service && npm ci
          cd ../gateway && npm ci

      - name: Start Auth Service
        working-directory: ./auth-service
        env:
          PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DB_NAME: auth_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm start &

      - name: Start Notification Service
        working-directory: ./notification-service
        env:
          PORT: 3002
          MONGO_URI: mongodb://mongo:mongo123@localhost:27017/notification_test?authSource=admin
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm start &

      - name: Start Gateway
        working-directory: ./gateway
        env:
          PORT: 3000
          AUTH_SERVICE_URL: http://localhost:3001
          NOTIFICATION_SERVICE_URL: http://localhost:3002
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm start &

      - name: Wait for services to be ready
        run: |
          echo "Waiting for auth service..."
          timeout 30 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
          echo "Auth service ready"
          echo "Waiting for notification service..."
          timeout 30 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
          echo "Notification service ready"
          echo "Waiting for gateway service..."
          timeout 30 bash -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
          echo "Gateway service ready"

      - name: Run gateway integration tests
        working-directory: ./gateway
        env:
          PORT: 3000
          AUTH_SERVICE_URL: http://localhost:3001
          NOTIFICATION_SERVICE_URL: http://localhost:3002
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm run test:integration -- --forceExit

  # ────────────────────────────────────────
  # DELIVERY SERVICE TESTS
  # ────────────────────────────────────────
  delivery-service-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo123
        options: >-
          --health-cmd "mongosh --username mongo --password mongo123 --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 27017:27017

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        working-directory: ./delivery-service
        env:
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: admin
          SPRING_RABBITMQ_PASSWORD: admin123
        run: mvn clean test -Dspring.data.mongodb.uri="mongodb://mongo:mongo123@localhost:27017/delivery_test?authSource=admin"

  # ────────────────────────────────────────
  # FINAL STATUS
  # ────────────────────────────────────────
  final-status:
    runs-on: ubuntu-latest
    needs: [auth-service-tests, notification-service-tests, gateway-integration-tests, delivery-service-tests]
    if: always()

    steps:
      - name: All tests passed
        if: >
          needs.auth-service-tests.result == 'success' &&
          needs.notification-service-tests.result == 'success' &&
          needs.gateway-integration-tests.result == 'success' &&
          needs.delivery-service-tests.result == 'success'
        run: echo "All tests passed successfully!"

      - name: Some tests failed
        if: >
          needs.auth-service-tests.result != 'success' ||
          needs.notification-service-tests.result != 'success' ||
          needs.gateway-integration-tests.result != 'success' ||
          needs.delivery-service-tests.result != 'success'
        run: |
          echo "auth-service: ${{ needs.auth-service-tests.result }}"
          echo "notification-service: ${{ needs.notification-service-tests.result }}"
          echo "gateway-integration: ${{ needs.gateway-integration-tests.result }}"
          echo "delivery-service: ${{ needs.delivery-service-tests.result }}"
          exit 1
